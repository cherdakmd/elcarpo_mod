name: Build and prepare release

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (Java 25)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      checks: write
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Java 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Validate cat profiles and textures
        run: python3 tools/validate_cat_profiles.py
      - name: Build and run unit tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace clean test build 2>&1 | tee "$RUNNER_TEMP/gradle.log"
      - name: Verify and package release files
        id: package
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import shutil
          import xml.etree.ElementTree as ET
          import zipfile
          from pathlib import Path

          properties = dict(
              line.split('=', 1) for line in Path('gradle.properties').read_text().splitlines()
              if line.strip() and not line.startswith('#')
          )
          version = properties['version']
          results = list(Path('build/test-results/test').glob('TEST-*.xml'))
          totals = {field: 0 for field in ('tests', 'failures', 'errors', 'skipped')}
          for result in results:
              attributes = ET.parse(result).getroot().attrib
              for field in totals:
                  totals[field] += int(attributes.get(field, 0))
          assert totals['tests'] >= 15, f'Missing unit tests: {totals}'
          assert not any(totals[field] for field in ('failures', 'errors', 'skipped')), totals

          binary = Path(f'build/libs/karas-cats-{version}.jar')
          sources = Path(f'build/libs/karas-cats-{version}-sources.jar')
          with zipfile.ZipFile(binary) as jar:
              metadata = json.loads(jar.read('fabric.mod.json'))
              assert metadata['id'] == 'karas_cats' and metadata['version'] == version, metadata
              assert 'ru/elcarpo/karascats/KarasCatsMod.class' in jar.namelist()
              assert 'data/karas_cats/cat_profile/karas.json' in jar.namelist()

          destination = Path('build/release')
          destination.mkdir(parents=True, exist_ok=True)
          for file in (binary, sources):
              shutil.copy2(file, destination / file.name)
          info = (
              f'Version: {version}\nCommit: {os.environ["GITHUB_SHA"]}\n'
              f'Minecraft: {properties["minecraft_version"]}\n'
              f'Fabric Loader: {properties["loader_version"]}\n'
              f'Fabric API: {properties["fabric_api_version"]}\nJava: 25\n'
              f'Unit tests: {totals["tests"]}, failures: 0, errors: 0, skipped: 0\n'
              f'Workflow: https://github.com/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}\n'
              'Manual in-game testing: not confirmed\n'
          )
          (destination / 'BUILD_INFO.txt').write_text(info, encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          print(info)
          PY
          (cd build/release && sha256sum *.jar > SHA256SUMS)
      - name: Upload build and test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-and-test-reports
          overwrite: true
          path: |
            build/reports/tests/test/
            build/test-results/test/
            ${{ runner.temp }}/gradle.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: karas-cats-${{ steps.package.outputs.version }}
          overwrite: true
          path: build/release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Report build failure
        if: failure() && github.event_name == 'push'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const path = `${process.env.RUNNER_TEMP}/gradle.log`;
            const log = fs.existsSync(path) ? fs.readFileSync(path, 'utf8').slice(-50000) : 'Gradle did not start; see the workflow job.';
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Gradle build diagnostics',
              head_sha: context.sha,
              status: 'completed',
              conclusion: 'failure',
              output: {
                title: 'Release build failed',
                summary: 'No release binaries were published. Fix the build before preparing a release.',
                text: '```text\n' + log + '\n```'
              }
            });

  attach_release:
    name: Upload prepared draft release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: karas-cats-${{ needs.build.outputs.version }}
          path: release
      - name: Attach files only to a matching draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          tag="v${RELEASE_VERSION}"
          releases=$(gh api "repos/${GH_REPO}/releases?per_page=100")
          release=$(jq -c --arg tag "$tag" 'map(select(.tag_name == $tag)) | first // empty' <<< "$releases")
          if [[ -z "$release" ]]; then
            echo "No prepared draft for $tag; verified files are available as workflow artifacts."
            exit 0
          fi
          if [[ $(jq -r '.draft' <<< "$release") != true || $(jq -r '.target_commitish' <<< "$release") != "$GITHUB_SHA" ]]; then
            echo "Release is published or targets another commit; refusing to change it."
            exit 0
          fi
          (cd release && sha256sum --check SHA256SUMS)
          grep -Fx "Commit: $GITHUB_SHA" release/BUILD_INFO.txt
          gh release upload "$tag" release/*.jar release/SHA256SUMS release/BUILD_INFO.txt --clobber
          echo "Uploaded verified files to draft $tag. Publication remains a separate explicit step."
